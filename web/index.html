<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Локальный трекер долгов: график платежей, оплаты, аналитика и прогноз выплат.">
  <title>Долги — график платежей</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("debt-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" data-icon="shield" data-icon-size="24"></div>
        <div class="brand-text">
          <b>Долг<span>Контроль</span></b>
          <small>трекер платежей</small>
        </div>
      </div>

      <nav class="nav" aria-label="Разделы приложения">
        <a class="nav-item" href="#/dashboard" data-route="dashboard">
          <span class="nav-icon" data-icon="dashboard"></span><span>Обзор</span>
        </a>
        <a class="nav-item" href="#/debts" data-route="debts">
          <span class="nav-icon" data-icon="wallet"></span><span>Мои долги</span>
        </a>
        <a class="nav-item" href="#/incomes" data-route="incomes">
          <span class="nav-icon" data-icon="income"></span><span>Доходы</span>
        </a>
        <a class="nav-item" href="#/schedule" data-route="schedule">
          <span class="nav-icon" data-icon="calendar"></span><span>График платежей</span>
        </a>
        <a class="nav-item" href="#/history" data-route="history">
          <span class="nav-icon" data-icon="clock"></span><span>История</span>
        </a>
        <a class="nav-item" href="#/analytics" data-route="analytics">
          <span class="nav-icon" data-icon="chart"></span><span>Аналитика</span>
        </a>
        <div class="nav-sep"></div>
        <a class="nav-item" href="#/settings" data-route="settings">
          <span class="nav-icon" data-icon="settings"></span><span>Настройки</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="side-card">
          <div class="side-label">Общий остаток</div>
          <div class="side-value" id="side-total">—</div>
          <div class="progress progress-sm"><span id="side-progress" style="width:0%"></span></div>
          <div class="side-sub" id="side-sub">Загрузка данных…</div>
        </div>
        <button class="btn btn-primary btn-block" data-action="add-debt">
          <span data-icon="plus"></span><span>Новый долг</span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-date" id="topbar-date"></span>
        </div>
        <div class="topbar-right">
          <span class="topbar-hint"><span data-icon="shield"></span>Данные хранятся локально</span>
          <button class="icon-btn income-bell" id="income-bell" data-action="receive-income" title="Доходы и поступления" aria-label="Доходы и поступления">
            <span data-icon="bell"></span>
            <i class="income-bell-dot" id="income-bell-dot" hidden></i>
          </button>
          <button class="icon-btn" data-action="toggle-theme" title="Переключить тему" aria-label="Переключить тему">
            <span id="theme-icon" data-icon="moon"></span>
          </button>
        </div>
      </header>

      <main class="view" id="view" aria-live="polite"></main>
    </div>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
